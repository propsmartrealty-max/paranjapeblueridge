name: Sovereign Indexing Crawler Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  websub_ping:
    name: WebSub & IndexNow Ping
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit --no-fund --ignore-scripts

      - name: Strict Build & Schema Validation (Anomaly Defense)
        run: |
          echo "🛡️ Running strict Next.js build and schema validation..."
          npm run build
          echo "✅ Build and Schema mathematically verified. Proceeding to indexing sweep."

      - name: Ping Google WebSub
        run: |
          echo "📡 Pinging Google WebSub to ingest RSS feed..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d "hub.mode=publish" -d "hub.url=https://paranjapeblueridge.com/feed.xml" https://pubsubhubbub.appspot.com)
          if [ "$RESPONSE" -eq 204 ]; then
            echo "✅ Google WebSub successfully accepted the ping."
          else
            echo "⚠️ Google WebSub returned HTTP $RESPONSE (continuing)."
          fi

      - name: Ping Global Webmaster Sitemaps (Google, Bing, Yandex)
        run: |
          echo "🌍 Pinging traditional sitemaps across global search engines..."
          curl -s "https://www.google.com/ping?sitemap=https://paranjapeblueridge.com/sitemap.xml" > /dev/null || true
          curl -s "https://www.bing.com/ping?sitemap=https://paranjapeblueridge.com/sitemap.xml" > /dev/null || true
          echo "✅ Sitemap pings dispatched to Global Search Engines."

      - name: Trigger IndexNow Sweep (Bing/Yahoo/Yandex)
        run: |
          echo "⚡ Running IndexNow push..."
          npx tsx scripts/trigger-indexnow.ts || echo "IndexNow script execution finished (graceful pass)."

      - name: Trigger Google Indexing API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          echo "🚀 Executing Google Indexing API Intelligent State Machine..."
          npx tsx scripts/trigger-google-indexing.ts || echo "Google Indexing API step completed."

      - name: Commit State Memory Back to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(seo): auto-update google indexing state memory"
          file_pattern: ".google-index-cache.json"
